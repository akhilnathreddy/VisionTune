[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visiontune"
version = "0.1.0"
description = "Parameter-efficient fine-tuning (LoRA / QLoRA) of Qwen2.5-VL for scientific visual question answering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Kaggle images ship torch preinstalled; these are the extra libraries for training/inference.
train = [
    "transformers>=4.57",
    "peft>=0.17",
    "accelerate>=1.0",
    "datasets>=3.0",
    "bitsandbytes>=0.45",
    "qwen-vl-utils>=0.0.11",
]
tracking = ["wandb>=0.19"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
